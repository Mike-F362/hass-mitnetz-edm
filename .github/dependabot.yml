version: 2
updates:
  # The Node 20 deprecation of actions/checkout surfaced only as a warning in a
  # build log. Dependabot would have opened a pull request for it instead.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "test"
