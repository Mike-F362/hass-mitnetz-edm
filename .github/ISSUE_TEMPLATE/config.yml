# Blank issues are disabled: a bug report without the diagnostics download and
# the OBIS codes cannot be acted on, and asking for them afterwards costs both
# sides a round trip.
blank_issues_enabled: false
contact_links:
  - name: Question about your meter or the portal
    url: https://github.com/Mike-F362/hass-mitnetz-edm/discussions
    about: >-
      Not sure whether something is a bug? Ask here. Which OBIS lines your
      portal account exposes differs between meters and contracts, and that
      alone explains most surprises.
  - name: Report a security problem
    url: https://github.com/Mike-F362/hass-mitnetz-edm/security/advisories/new
    about: >-
      Privately, not as a public issue - this integration handles your portal
      credentials. See SECURITY.md.
  - name: Home Assistant community
    url: https://community.home-assistant.io/
    about: General Home Assistant questions unrelated to this integration.
